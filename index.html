<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hof">
<title>Ackerschlagkartei</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: mobile-first App-Shell — scrollender Inhalt, feste Tab-Leiste unten, Mikrofon-FAB rechts darüber, Bottom-Sheets für Formulare */
:root{
  --bg:#F3F4EF; --card:#FFFFFF; --line:#DDE1D8; --line2:#EDEFE8; --seg:#E4E7DF; --field:#FAFBF8;
  --fg:#18241B; --fg2:#5B665D; --fg3:#3D4840;
  --pri:#2F5D3A; --pri-d:#1F4128; --pri-l:#E3ECDF; --on-pri:#FFFFFF; --hero:#2F5D3A;
  --warn:#8F5508; --warn-l:#F4E8D3; --bad:#A3342B; --info-l:#E1EBEF; --info:#1F4E5F;
  --chip-on:#18241B; --chip-on-fg:#FFFFFF;
  --c-pacht:#2F5D3A; --c-masch:#6F8F5E; --c-dueng:#B07A1E; --c-psm:#1F4E5F; --c-saat:#8FA9B4; --c-sonst:#B9BEB2;
  --map:#5E7350; --shadow:0 2px 10px rgba(0,0,0,.16);
  --f-ui:Archivo,"Helvetica Neue",Arial,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --card:#1A211C; --line:#2D372F; --line2:#242C26; --seg:#232B25; --field:#151B17;
  --fg:#E5EBE2; --fg2:#9AA59C; --fg3:#C3CCC0;
  --pri:#86B891; --pri-d:#A6CFAF; --pri-l:#22362A; --on-pri:#0E1A11; --hero:#29513A;
  --warn:#E3A55B; --warn-l:#3A2C17; --bad:#E07A6F; --info-l:#1C2D33; --info:#8EC3D4;
  --chip-on:#E5EBE2; --chip-on-fg:#111612;
  --c-pacht:#4F8A5D; --c-masch:#8DAD7B; --c-dueng:#CF9A3E; --c-psm:#4E91A6; --c-saat:#A3BCC6; --c-sonst:#7C8378;
  --map:#33402E; --shadow:0 2px 12px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111612; --card:#1A211C; --line:#2D372F; --line2:#242C26; --seg:#232B25; --field:#151B17;
  --fg:#E5EBE2; --fg2:#9AA59C; --fg3:#C3CCC0;
  --pri:#86B891; --pri-d:#A6CFAF; --pri-l:#22362A; --on-pri:#0E1A11; --hero:#29513A;
  --warn:#E3A55B; --warn-l:#3A2C17; --bad:#E07A6F; --info-l:#1C2D33; --info:#8EC3D4;
  --chip-on:#E5EBE2; --chip-on-fg:#111612;
  --c-pacht:#4F8A5D; --c-masch:#8DAD7B; --c-dueng:#CF9A3E; --c-psm:#4E91A6; --c-saat:#A3BCC6; --c-sonst:#7C8378;
  --map:#33402E; --shadow:0 2px 12px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--fg2)}
#app{height:100%;display:flex;flex-direction:column;max-width:620px;margin:0 auto;position:relative;background:var(--bg)}

.page{padding:20px 16px 110px;display:flex;flex-direction:column;gap:16px}
.page.full{padding:0;height:100%}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:16px;font-weight:700}
.eyebrow{font-size:13px;color:var(--fg2);font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tight{padding:6px 16px;gap:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-h small{font-size:12px;color:var(--fg2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left}
.tile .l{font-size:11px;color:var(--fg2);font-weight:600;text-transform:none}
.tile .v{font-size:19px}
.tile .s{font-size:12px;color:var(--fg2)}
button.tile{cursor:pointer}
.tile.soft{background:var(--bg);border:none}
.hero{background:var(--hero);color:#FFFFFF;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px}
.hero .l{font-size:13px;font-weight:600;opacity:.9}
.hero .v{font-family:var(--f-num);font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .s{font-size:13px;opacity:.9}
.hero .steps{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);font-size:12px}
.hero .steps b{font-family:var(--f-num);font-weight:600}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--pri);cursor:pointer;flex-shrink:0}
.btn{height:46px;padding:0 16px;border-radius:13px;border:none;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--pri);color:var(--on-pri)}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--fg)}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.danger{color:var(--bad)}
.btn.sm{height:38px;font-size:13px;padding:0 12px;border-radius:11px}
.btn.dash{background:transparent;border:1.5px dashed var(--pri);color:var(--pri);width:100%;height:48px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 0;border-top:1px solid var(--line2);text-decoration:none;color:var(--fg);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
.card.tight>.row:first-child,.card .rows>.row:first-child{border-top:none}
.row .main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row .t{font-weight:600;font-size:14px}
.row .sub{font-size:12px;color:var(--fg2)}
.row .r{font-family:var(--f-num);font-size:13px;font-weight:600;white-space:nowrap;text-align:right}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;cursor:pointer;color:var(--fg)}
.chip.on{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.seg{display:grid;gap:4px;background:var(--seg);border-radius:12px;padding:4px}
.seg button{height:40px;border:none;border-radius:9px;font-size:13px;font-weight:700;background:transparent;color:var(--fg2);cursor:pointer;padding:0 4px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{font-size:11px;font-weight:700;padding:5px 8px;border-radius:7px;white-space:nowrap;background:var(--pri-l);color:var(--pri)}
.badge.mr{background:var(--info-l);color:var(--info)}
.badge.lu,.badge.warn{background:var(--warn-l);color:var(--warn)}
.badge.plan{background:var(--seg);color:var(--fg2)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--line2)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;align-items:center;gap:10px;font-size:14px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend .lab{flex:1}
.legend .pct{width:40px;text-align:right;font-size:12px;color:var(--fg2)}
.meter{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:8px;background:var(--pri);border-radius:4px}
.warn{color:var(--warn)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px}
.search input{border:none;outline:none;flex:1;background:transparent;font-size:15px;min-width:0}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--fg2);font-size:14px}
.empty b{color:var(--fg);font-size:16px}
.month{margin:6px 0 0;font-size:12px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.07em}
.mcard{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.mcard .date{width:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;padding:6px 0;flex-shrink:0}
.mcard .date b{font-size:17px;font-weight:800}
.mcard .date span{font-size:10px;color:var(--fg2);font-weight:700}
.mcard .body{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcard .top{display:flex;justify-content:space-between;gap:8px}
.mcard .top b{font-size:14px}
.mcard .sub{font-size:12px;color:var(--fg2)}
.mcard .mit{font-size:12px;color:var(--fg3);overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:5px;flex-shrink:0;display:inline-block}
.timeline .row{cursor:pointer}
.dbcalc{display:flex;flex-direction:column;gap:8px}
.dbcalc .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--fg3)}
.dbcalc .ln.sum{color:var(--fg);font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.dbcalc .ln.final{border-top:2px solid var(--fg);padding-top:10px;font-size:16px;font-weight:800;color:var(--fg)}
.dbcalc .ln.final .num{color:var(--pri)}
.dbcalc .ln.final .num.neg{color:var(--bad)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--pri);font-weight:600;font-size:15px;background:none;border:none;padding:0;cursor:pointer;align-self:flex-start}
/* nav */
nav.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));flex-shrink:0}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;background:none;border:none;color:var(--fg2);font-size:11px;font-weight:500;cursor:pointer;padding:0}
nav.tabs button span.ic{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
nav.tabs button.on{color:var(--pri);font-weight:700}
nav.tabs button.on span.ic{background:var(--pri-l)}
#fab{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:31px;border:none;background:var(--pri);color:var(--on-pri);box-shadow:0 6px 18px rgba(31,65,40,.38);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20}
#fab::after{content:"";position:absolute;inset:-5px;border-radius:36px;border:2px solid var(--pri);opacity:.25}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,16,12,.45)}
.sheet{position:relative;background:var(--card);width:100%;max-width:620px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.sh-head h2{font-size:19px;font-weight:800}
.sh-head .icon-btn{border:none;background:var(--bg);color:var(--fg)}
.sh-body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.sh-foot{display:flex;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--line2);justify-content:flex-end}
.sh-foot .btn.pri{flex:1}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:12px;font-weight:600;color:var(--fg2)}
.fld>span i{font-style:normal;font-weight:500}
.fld input,.fld select,.fld textarea,.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:0 12px;font-size:15px;width:100%;min-width:0}
.fld textarea,textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.4}
.sub-h{font-size:13px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;background:var(--field)}
.line .fld.w2{grid-column:span 2}
.line .fld.w3{grid-column:1/-1}
.line .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--fg2);cursor:pointer}
.line .cost{grid-column:1/-1;font-size:12px;color:var(--fg2);display:flex;justify-content:space-between}
.sum-box{background:var(--pri-l);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--fg)}
.sum-box .big{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.note{font-size:12px;color:var(--fg2);line-height:1.45}
.note.box{background:var(--bg);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chip-on);color:var(--chip-on-fg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;max-width:min(92vw,520px);box-shadow:var(--shadow);text-align:center}
.banner{background:var(--warn-l);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
/* map */
.map-wrap{position:relative;height:100%;overflow:hidden;background:var(--map)}
#mapsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.map-top{position:absolute;top:14px;left:14px;right:14px;display:flex;flex-direction:column;gap:10px;z-index:3}
.map-top .search{border:none;box-shadow:var(--shadow);height:48px;border-radius:14px}
.map-top .chip{border:none;box-shadow:0 1px 6px rgba(0,0,0,.18);height:34px}
.map-ctl{position:absolute;right:14px;top:132px;display:flex;flex-direction:column;gap:8px;z-index:3}
.map-ctl button{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);box-shadow:var(--shadow);color:var(--fg);font-size:20px;font-weight:700;cursor:pointer}
.bsheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,.2);z-index:4;max-height:62%;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.flist{display:flex;flex-direction:column;gap:0}
/* assistant */
.as-actions{display:flex;gap:8px;flex-wrap:wrap}
.as-card{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--field)}
.as-card .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--pri)}
.as-card .t{font-weight:700}
.as-card ul{margin:0;padding-left:18px;font-size:13px;color:var(--fg3);display:flex;flex-direction:column;gap:2px}
.as-card.done{opacity:.6}
.thumb{max-height:150px;border-radius:12px;align-self:flex-start;border:1px solid var(--line)}
.rec{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.rec{animation:none}}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
table.tbl{border-collapse:collapse;font-size:12px;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;white-space:nowrap}
.tbl th{color:var(--fg2);font-weight:700}
.scroll-x{overflow-x:auto;max-width:100%}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr);align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line2);font-size:13px}
.maprow .src{font-family:var(--f-num);color:var(--fg3);overflow-wrap:anywhere}
.maprow select{height:40px}
.src-btn{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;width:100%;color:var(--fg)}
.src-btn.on{border-color:var(--pri)}
.src-btn .k{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:11px;font-weight:600;color:var(--pri);flex-shrink:0}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--field);cursor:pointer;color:var(--fg)}
.drop input{display:none}
svg.chart text{fill:var(--fg2);font-family:var(--f-ui);font-size:10px}
@media (min-width:700px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
<style>
#app{padding-top:env(safe-area-inset-top,0px)}
#stage{flex:1;position:relative;min-height:0}
#main{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg)}
#maplayer{position:absolute;inset:0;background:var(--map);z-index:0}
#main.overmap{background:transparent;pointer-events:none}
#main.overmap .page.full,#main.overmap .map-wrap{background:transparent}
#main.overmap .map-top,#main.overmap .bsheet,#main.overmap .map-ctl{pointer-events:auto}
.auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:32px 20px;max-width:440px;margin:0 auto}
.auth h1{font-size:30px}
.auth .logo{width:64px;height:64px;border-radius:18px;background:var(--pri);color:var(--on-pri);display:flex;align-items:center;justify-content:center}
.codeinp{font-family:var(--f-num);font-size:24px;letter-spacing:.3em;text-align:center}
.live{min-height:70px;font-size:17px;line-height:1.45;padding:12px 14px;border-radius:14px;background:var(--pri-l);color:var(--fg)}
.live:empty::before{content:"Ich höre zu …";color:var(--fg2)}
.recbtn{width:84px;height:84px;border-radius:42px;border:none;background:var(--pri);color:var(--on-pri);display:flex;align-items:center;justify-content:center;align-self:center;cursor:pointer;box-shadow:0 6px 18px rgba(31,65,40,.35)}
.recbtn.rec{background:var(--bad);animation:pulse 1.2s infinite}
.member{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
.member:first-child{border-top:none}
.member .main{flex:1;min-width:0;overflow-wrap:anywhere}
.leaflet-container{background:var(--map);font-family:var(--f-ui)}
.flabel{background:transparent;border:none;box-shadow:none;color:#FFFFFF;font-weight:800;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.85);padding:0}
.flabel::before{display:none}
.vtx{background:#FFD24A;border:3px solid #FFFFFF;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.leaflet-control-attribution{font-size:9px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.netbadge{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px;background:var(--warn-l);color:var(--warn)}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="maplayer" hidden></div><main id="main"></main></div>
  <button id="fab" data-act="fabMic" aria-label="Sprechen"></button>
  <nav class="tabs" id="tabs" aria-label="Hauptnavigation"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
